<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title data-i18n="adminbookings.title">Admin Bookings — Booky</title>
  <meta name="description" content="Manage all bookings across the Booky platform." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#7c5cff" />


  <link rel="stylesheet" href="css/style.css" />
  <script src="/js/i18n/ar.js"></script>
  <script src="/js/i18n.js"></script>
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

  <div class="app-shell">
    <aside class="sidebar">
      <div class="sidebar-logo">
        <a href="dashboard.html" class="logo">
          <span class="logo-mark">📅</span>
          <span>Booky</span>
        </a>
      </div>

      <nav class="sidebar-nav">
        <a href="dashboard.html" class="sidebar-link">
          <span class="ico">🏠</span>
          <span data-i18n="nav.dashboard">Dashboard</span>
        </a>

        <a href="admin.html" class="sidebar-link">
          <span class="ico">🛡️</span>
          <span data-i18n="menu.adminPanel">Admin Panel</span>
        </a>

        <a href="admin-add-business.html" class="sidebar-link">
          <span class="ico">➕</span>
          <span data-i18n="menu.addBusiness">Add Business</span>
        </a>

        <a href="admin-bookings.html" class="sidebar-link active">
          <span class="ico">📅</span>
          <span data-i18n="menu.allBookings">All Bookings</span>
        </a>

        <a href="browse.html" class="sidebar-link">
          <span class="ico">🏢</span>
          <span data-i18n="dash.stat.businesses">Businesses</span>
        </a>

        <a href="profile.html" class="sidebar-link">
          <span class="ico">👤</span>
          <span data-i18n="menu.profile">Profile</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="avatar" id="avatarInitial">A</div>
          <div class="user-chip-info">
            <div class="user-chip-name" id="userName">Admin</div>
            <div class="user-chip-role" id="userRole" data-i18n="role.admin">ADMIN</div>
          </div>
        </div>

        <button type="button" class="btn btn-ghost btn-block btn-sm lang-toggle" data-lang-toggle>العربية</button>

        <button class="btn btn-danger btn-block btn-sm" id="logoutBtn" data-i18n="nav.logout">
          Log out
        </button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <div>
          <span class="eyebrow" data-i18n="adminbookings.eyebrow">Booking Control</span>
          <h1 data-i18n="adminbookings.heading">Admin Booking Management 📅</h1>
          <p data-i18n="adminbookings.text">Review appointment requests and accept or decline bookings.</p>
        </div>

        <button class="btn btn-ghost btn-sm" id="refreshBtn" data-i18n="common.refresh">
          Refresh
        </button>
      </div>

      <section class="glass-card admin-section">
        <div class="admin-section-header">
          <div>
            <h2 data-i18n="menu.allBookings">All Bookings</h2>
          
          </div>
        </div>

        <div id="message" class="message"></div>

        <div id="bookingsContainer" class="admin-list">
          <!-- Bookings load here -->
        </div>
      </section>
    </main>
  </div>

  <script src="js/admin-bookings.js"></script>
  <script src="/js/cookie-consent.js"></script>
  <script src="/js/responsive.js"></script>
</body>
</html>
