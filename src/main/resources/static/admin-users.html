<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Admin Users — Booky</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <a href="dashboard.html" class="logo">
      <span class="logo-mark">📅</span>
      <span>Booky</span>
    </a>

    <nav class="nav-links">
      <a href="dashboard.html" class="btn btn-ghost btn-sm">Dashboard</a>
      <button id="logoutBtn" class="btn btn-danger btn-sm">Log out</button>
    </nav>
  </div>
</header>

<main class="container section">
  <div class="section-head">
    <span class="eyebrow">Admin Panel</span>
    <h2>User Management</h2>
    <p>View, search, edit, freeze, and unfreeze Booky accounts.</p>
  </div>

  <div id="message" class="message"></div>

  <section class="glass-card admin-users-card">
    <div class="admin-users-top">
      <div>
        <h3>All Users</h3>
        <p id="userCount">Loading users...</p>
      </div>

      <input
        type="text"
        id="searchInput"
        class="admin-search"
        placeholder="Search by name, email, phone, role, or status..."
      />
    </div>

    <div class="table-wrap">
      <table class="admin-table">
        <thead>
          <tr>
            <th>ID</th>
            <th>Full Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Role</th>
            <th>Status</th>
            <th>Freeze Reason</th>
            <th>Actions</th>
          </tr>
        </thead>

        <tbody id="usersTableBody">
          <tr>
            <td colspan="8">Loading...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </section>
</main>

<!-- Freeze account modal -->
<div id="freezeModal" class="admin-modal hidden">
  <div class="admin-modal-backdrop" id="freezeModalBackdrop"></div>

  <section
    class="admin-modal-content glass-card"
    role="dialog"
    aria-modal="true"
    aria-labelledby="freezeModalTitle"
  >
    <div class="admin-modal-head">
      <div>
        <span class="eyebrow">Account Action</span>
        <h3 id="freezeModalTitle">Freeze Account</h3>
      </div>

      <button
        type="button"
        id="closeFreezeModalBtn"
        class="modal-close-btn"
        aria-label="Close"
      >
        ×
      </button>
    </div>

    <p id="freezeUserText" class="modal-user-text"></p>

    <label for="freezeReason">Reason</label>

    <textarea
      id="freezeReason"
      class="admin-textarea"
      rows="5"
      maxlength="500"
      placeholder="Explain why this account is being frozen..."
    ></textarea>

    <div class="modal-footer">
      <button
        type="button"
        id="cancelFreezeBtn"
        class="btn btn-ghost"
      >
        Cancel
      </button>

      <button
        type="button"
        id="confirmFreezeBtn"
        class="btn btn-danger"
      >
        Freeze Account
      </button>
    </div>
  </section>
</div>

<script src="js/admin-users.js"></script>
</body>
</html>
