<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title data-i18n="adminreviews.title">Admin Reviews — Booky</title>
  <meta name="description" content="Moderate reviews across Booky." />
  <meta name="robots" content="noindex, nofollow" />

  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#7c5cff" />

  <link rel="stylesheet" href="/css/style.css" />
  <script src="/js/i18n/ar.js"></script>
  <script src="/js/i18n.js"></script>
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
  <link rel="stylesheet" href="/css/admin-reviews.css" />
</head>

<body class="admin-reviews-page">

  <header class="navbar">
    <div class="navbar-inner">
      <a href="dashboard.html" class="logo" aria-label="Booky dashboard" data-i18n-attr="aria-label:ownerservices.logoLabel">
        <span class="logo-mark" aria-hidden="true">📅</span>
        <span>Booky</span>
      </a>

      <nav class="nav-links" aria-label="Account navigation" data-i18n-attr="aria-label:adminreviews.navLabel">
        <a href="dashboard.html" class="btn btn-ghost btn-sm" data-i18n="nav.dashboard">
          Dashboard
        </a>

        <a href="admin-users.html" class="btn btn-ghost btn-sm" data-i18n="menu.usersShort">
          Users
        </a>

        <button type="button" class="btn btn-ghost btn-sm lang-toggle" data-lang-toggle>العربية</button>

        <button
          id="logoutBtn"
          type="button"
          class="btn btn-danger btn-sm"
        data-i18n="nav.logout">
          Log out
        </button>
      </nav>
    </div>
  </header>

  <main class="container reviews-main">
    <header class="reviews-heading">
      <span class="eyebrow" data-i18n="adminreviews.eyebrow">Admin workspace</span>
      <h1 data-i18n="menu.reviewManagement">Review Management</h1>
      <p data-i18n="adminreviews.text">Read customer feedback and remove inappropriate reviews.</p>
    </header>

    <div
      id="message"
      class="message"
      role="status"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <section
      class="glass-card reviews-panel"
      aria-labelledby="reviewsListTitle"
    >
      <div class="reviews-toolbar">
        <div>
          <h2 id="reviewsListTitle" data-i18n="adminreviews.listTitle">Customer reviews</h2>
          <p id="reviewCount" aria-live="polite" data-i18n="details.reviews.loading">
            Loading reviews...
          </p>
        </div>

        <div class="reviews-search">
          <label for="searchInput" data-i18n="adminreviews.search">Search feedback</label>

          <input
            id="searchInput"
            type="search"
            placeholder="Business, client or comment" data-i18n-attr="placeholder:adminreviews.searchPlaceholder"
            autocomplete="off"
            aria-controls="reviewsTableBody"
            aria-describedby="reviewsSearchHint"
          />

          <p id="reviewsSearchHint" data-i18n="adminreviews.searchHint">
            You can also search by service, email, rating, or review ID.
          </p>
        </div>
      </div>

      <div class="table-wrap reviews-table-wrap">
        <table
          class="admin-table reviews-table"
          role="table"
          aria-label="Customer reviews" data-i18n-attr="aria-label:adminreviews.listTitle"
        >
          <thead role="rowgroup">
            <tr role="row">
              <th scope="col" data-i18n="common.id">ID</th>
              <th scope="col" data-i18n="common.business">Business</th>
              <th scope="col" data-i18n="common.serviceCol">Service</th>
              <th scope="col" data-i18n="common.client">Client</th>
              <th scope="col" data-i18n="common.rating">Rating</th>
              <th scope="col" data-i18n="review.comment">Comment</th>
              <th scope="col" data-i18n="common.date">Date</th>
              <th scope="col" data-i18n="common.action">Action</th>
            </tr>
          </thead>

          <tbody id="reviewsTableBody" role="rowgroup">
            <tr>
              <td colspan="8" data-i18n="details.reviews.loading">Loading reviews...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/admin-reviews.js"></script>
  <script src="/js/cookie-consent.js"></script>
  <script src="/js/responsive.js"></script>
</body>
</html>
