<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title data-i18n="hours.title">Business Hours — Booky</title>
  <meta name="description" content="Set your business hours on Booky." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#7c5cff" />


  <link rel="stylesheet" href="css/style.css" />
  <script src="/js/i18n/ar.js"></script>
  <script src="/js/i18n.js"></script>
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <a href="dashboard.html" class="logo">
      <span class="logo-mark">📅</span>
      <span>Booky</span>
    </a>

    <nav class="nav-links">
      <button type="button" class="btn btn-ghost btn-sm lang-toggle" data-lang-toggle>العربية</button>
      <a href="dashboard.html" class="btn btn-ghost btn-sm" data-i18n="nav.backDashboard">← Dashboard</a>
    </nav>
  </div>
</header>

<main class="container section">
  <div class="section-head center">
    <span class="eyebrow" data-i18n="role.owner">Owner</span>
    <h2 data-i18n="menu.businessHours">Business Hours</h2>
    <p data-i18n="hours.text">Set when your business is open or closed.</p>
  </div>

  <section class="glass-card auth-card">
    <div class="card-header">
      <div>
        <h3 data-i18n="hours.choose">Choose Business</h3>
        <p data-i18n="hours.chooseText">Select one of your businesses and manage its schedule.</p>
      </div>
    </div>

    <div id="message" class="message"></div>

    <div class="form-stack">
      <div class="form-group">
        <label class="form-label" for="businessSelect" data-i18n="common.business">Business</label>
        <select id="businessSelect" class="form-input">
          <option value="" data-i18n="browse.loading">Loading businesses...</option>
        </select>
      </div>
    </div>
  </section>

  <section class="glass-card auth-card" style="margin-top: 24px;">
    <div class="card-header">
      <div>
        <h3 data-i18n="hours.weekly">Weekly Schedule</h3>
        <p data-i18n="hours.weeklyText">Save opening and closing hours for each day.</p>
      </div>
    </div>

    <div id="hoursList" class="form-stack"></div>
  </section>
</main>

<script src="js/owner-business-hours.js"></script>
  <script src="/js/cookie-consent.js"></script>
  <script src="/js/responsive.js"></script>
</body>
</html>
