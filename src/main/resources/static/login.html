<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Login — Booky</title>
  <meta name="description" content="Log in to your Booky account to book appointments or manage your business." />
  <link rel="canonical" href="https://booky.example/login.html" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Login — Booky" />
  <meta property="og:description" content="Log in to your Booky account to book appointments or manage your business." />
  <meta property="og:url" content="https://booky.example/login.html" />
  <meta property="og:site_name" content="Booky" />
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Login — Booky" />
  <meta name="twitter:description" content="Log in to your Booky account to book appointments or manage your business." />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#7c5cff" />


  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="auth-page">
    <div class="auth-shell">
      <a href="index.html" class="auth-back">← Back to home</a>

      <section class="glass-card auth-card">
        <div class="auth-logo">
          <a href="index.html" class="logo">
            <span class="logo-mark">📅</span>
            <span>Booky</span>
          </a>
        </div>

        <div class="auth-heading">
          <span class="eyebrow">Welcome Back</span>
          <h1 class="auth-title">Log in to your account</h1>
          <p class="auth-subtitle">Continue managing appointments, services, and bookings.</p>
        </div>

        <div id="formAlert" class="alert alert-error"></div>

        <form id="loginForm" class="form-stack" novalidate>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input
              type="email"
              id="email"
              class="form-input"
              placeholder="you@example.com"
              autocomplete="email"
            />
            <div class="field-error-msg" id="emailError">Enter a valid email address.</div>
          </div>

          <div class="form-group">
            <label class="form-label" for="password">Password</label>

            <div class="password-field">
              <input
                type="password"
                id="password"
                class="form-input"
                placeholder="Your password"
                autocomplete="current-password"
              />
              <button type="button" class="password-toggle" data-target="password">SHOW</button>
            </div>

            <div class="field-error-msg" id="passwordError">Password is required.</div>
          </div>

          <div class="form-row-between">
            <label class="checkbox-row" for="rememberMe">
              <input type="checkbox" id="rememberMe" />
              Remember me
            </label>
          </div>

          <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
            <span class="spinner"></span>
            <span class="btn-label">Log in</span>
          </button>
        </form>

        <p class="auth-footer-text">
          Don't have an account?
          <a href="register.html">Create one</a>
        </p>
      </section>

      <p class="auth-footer-text" style="margin-top: var(--sp-4); font-size: 0.8rem;">
        <a href="privacy.html">Privacy Policy</a> · <a href="terms.html">Terms</a> · <a href="faq.html">FAQ</a>
      </p>
    </div>
  </main>

  <div class="toast" id="toast"></div>

  <script src="js/login.js"></script>
  <script src="/js/cookie-consent.js"></script>
</body>
</html>
