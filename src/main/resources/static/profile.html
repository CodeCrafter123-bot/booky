<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Profile — Booky</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">
      <a href="dashboard.html" class="logo">
        <span class="logo-mark">📅</span>
        <span>Booky</span>
      </a>

      <nav class="nav-links">
        <a href="dashboard.html" class="btn btn-ghost btn-sm">Dashboard</a>
        <a href="browse.html" class="btn btn-ghost btn-sm">Browse</a>
        <a href="my-bookings.html" class="btn btn-ghost btn-sm">My Bookings</a>
        <button id="logoutBtn" class="btn btn-danger btn-sm">Log out</button>
      </nav>
    </div>
  </header>

  <main class="container section">
    <div class="section-head">
      <span class="eyebrow">Account</span>
      <h2>My Profile</h2>
      <p>View your Booky account information and quick actions.</p>
    </div>

    <div id="message" class="message"></div>

    <section class="profile-layout">
      <div class="glass-card profile-card">
        <div class="card-header">
          <div>
            <h3>Account Information</h3>
            <p>Your saved user details.</p>
          </div>
        </div>

        <div class="profile-info">
          <div class="profile-row">
            <strong>Full Name</strong>
            <span id="fullName">Loading...</span>
          </div>

          <div class="profile-row">
            <strong>Email</strong>
            <span id="email">Loading...</span>
          </div>

          <div class="profile-row">
            <strong>Role</strong>
            <span id="role">Loading...</span>
          </div>
        </div>
      </div>

      <div class="glass-card profile-card">
        <div class="card-header">
          <div>
            <h3>Quick Actions</h3>
            <p>Move quickly to the most used pages.</p>
          </div>
        </div>

        <div class="profile-actions">
          <button class="btn btn-primary btn-block" onclick="location.href='browse.html'">
            Browse Businesses
          </button>

          <button class="btn btn-ghost btn-block" onclick="location.href='my-bookings.html'">
            My Bookings
          </button>
        </div>
      </div>
    </section>
  </main>

  <script src="js/profile.js"></script>
</body>
</html>
