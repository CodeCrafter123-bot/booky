<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Profile — Booky</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <a href="dashboard.html" class="logo">
      <span class="logo-mark">📅</span>
      <span>Booky</span>
    </a>

    <nav class="nav-links">
      <a href="dashboard.html" class="btn btn-ghost btn-sm">Dashboard</a>
      <a href="browse.html" class="btn btn-ghost btn-sm">Browse</a>
      <a href="my-bookings.html" class="btn btn-ghost btn-sm">My Bookings</a>
      <button id="logoutBtn" class="btn btn-danger btn-sm">Log out</button>
    </nav>
  </div>
</header>

<main class="container section">

  <section class="profile-hero glass-card">
    <div class="profile-avatar" id="profileAvatar">U</div>

    <div>
      <span class="eyebrow">Account Settings</span>
      <h2 id="profileTitle">My Profile</h2>
      <p>Manage your personal Booky account details.</p>
    </div>
  </section>

  <div id="message" class="message"></div>

  <section class="profile-layout">

    <div class="glass-card profile-card">
      <div class="card-header">
        <div>
          <h3>Edit Profile</h3>
          <p>Update your account information.</p>
        </div>
      </div>

      <form id="profileForm" class="form-grid">

        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            placeholder="Enter your full name"
            required
          />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
          />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input
            type="text"
            id="phone"
            placeholder="Enter your phone number"
            required
          />
        </div>

        <div class="form-group">
          <label for="role">Role</label>
          <input
            type="text"
            id="role"
            disabled
          />
          <small class="input-note">Your role cannot be changed from this page.</small>
        </div>

        <button type="submit" id="saveBtn" class="btn btn-primary btn-block">
          Save Changes
        </button>

      </form>
    </div>

    <div class="glass-card profile-card">
      <div class="card-header">
        <div>
          <h3>Account Summary</h3>
          <p>Your current Booky profile.</p>
        </div>
      </div>

      <div class="profile-summary">
        <div>
          <span>Name</span>
          <strong id="summaryName">-</strong>
        </div>

        <div>
          <span>Email</span>
          <strong id="summaryEmail">-</strong>
        </div>

        <div>
          <span>Phone</span>
          <strong id="summaryPhone">-</strong>
        </div>

        <div>
          <span>Role</span>
          <strong id="summaryRole">-</strong>
        </div>
      </div>

      <div class="profile-actions">
        <button class="btn btn-primary btn-block" onclick="location.href='browse.html'">
          Browse Businesses
        </button>

        <button class="btn btn-ghost btn-block" onclick="location.href='my-bookings.html'">
          My Bookings
        </button>
      </div>
    </div>

  </section>
</main>

<script src="js/profile.js"></script>
</body>
</html>
