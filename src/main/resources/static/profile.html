<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title data-i18n="profile.title">Profile — Booky</title>
  <meta name="description" content="Manage your Booky account profile and contact details." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#7c5cff" />


  <link rel="stylesheet" href="css/style.css" />
  <script src="/js/i18n/ar.js"></script>
  <script src="/js/i18n.js"></script>
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <a href="dashboard.html" class="logo">
      <span class="logo-mark">📅</span>
      <span>Booky</span>
    </a>

    <nav class="nav-links">
      <button type="button" class="btn btn-ghost btn-sm lang-toggle" data-lang-toggle>العربية</button>
      <a href="dashboard.html" class="btn btn-ghost btn-sm" data-i18n="nav.dashboard">Dashboard</a>
      <a href="browse.html" class="btn btn-ghost btn-sm" data-i18n="nav.browse">Browse</a>
      <a href="my-bookings.html" class="btn btn-ghost btn-sm" data-i18n="menu.myBookings">My Bookings</a>
      <button id="logoutBtn" class="btn btn-danger btn-sm" data-i18n="nav.logout">Log out</button>
    </nav>
  </div>
</header>

<main class="container section">

  <section class="profile-hero glass-card">
    <div class="profile-avatar" id="profileAvatar">U</div>

    <div>
      <span class="eyebrow" data-i18n="profile.eyebrow">Account Settings</span>
      <h2 id="profileTitle">My Profile</h2>
      <p data-i18n="profile.text">Manage your personal Booky account details.</p>
    </div>
  </section>

  <div id="message" class="message"></div>

  <section class="profile-layout">

    <div class="glass-card profile-card">
      <div class="card-header">
        <div>
          <h3 data-i18n="profile.edit">Edit Profile</h3>
          <p data-i18n="profile.editText">Update your account information.</p>
        </div>
      </div>

      <form id="profileForm" class="form-grid">

        <div class="form-group">
          <label for="fullName" data-i18n="auth.fullName">Full Name</label>
          <input
            type="text"
            id="fullName"
            placeholder="Enter your full name" data-i18n-attr="placeholder:profile.fullNamePlaceholder"
            required
          />
        </div>

        <div class="form-group">
          <label for="email" data-i18n="profile.email">Email Address</label>
          <input
            type="email"
            id="email"
            placeholder="Enter your email" data-i18n-attr="placeholder:profile.emailPlaceholder"
            required
          />
        </div>

        <div class="form-group">
          <label for="phone" data-i18n="auth.phone">Phone Number</label>
          <input
            type="text"
            id="phone"
            placeholder="Enter your phone number" data-i18n-attr="placeholder:profile.phonePlaceholder"
            required
          />
        </div>

        <div class="form-group">
          <label for="role" data-i18n="dash.stat.role">Role</label>
          <input
            type="text"
            id="role"
            disabled
          />
          <small class="input-note" data-i18n="profile.roleNote">Your role cannot be changed from this page.</small>
        </div>

        <button type="submit" id="saveBtn" class="btn btn-primary btn-block" data-i18n="common.saveChanges">
          Save Changes
        </button>

      </form>
    </div>

    <div class="glass-card profile-card">
      <div class="card-header">
        <div>
          <h3 data-i18n="profile.summary">Account Summary</h3>
          <p data-i18n="profile.summaryText">Your current Booky profile.</p>
        </div>
      </div>

      <div class="profile-summary">
        <div>
          <span data-i18n="common.name">Name</span>
          <strong id="summaryName">-</strong>
        </div>

        <div>
          <span data-i18n="auth.email">Email</span>
          <strong id="summaryEmail">-</strong>
        </div>

        <div>
          <span data-i18n="common.phone">Phone</span>
          <strong id="summaryPhone">-</strong>
        </div>

        <div>
          <span data-i18n="dash.stat.role">Role</span>
          <strong id="summaryRole">-</strong>
        </div>
      </div>

      <div class="profile-actions">
        <button class="btn btn-primary btn-block" onclick="location.href='browse.html'" data-i18n="menu.browse">
          Browse Businesses
        </button>

        <button class="btn btn-ghost btn-block" onclick="location.href='my-bookings.html'" data-i18n="menu.myBookings">
          My Bookings
        </button>
      </div>
    </div>

  </section>
</main>

<script src="js/profile.js"></script>
  <script src="/js/cookie-consent.js"></script>
  <script src="/js/responsive.js"></script>
</body>
</html>
