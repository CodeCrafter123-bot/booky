
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title data-i18n="mybookings.title">My Bookings — Booky</title>
  <meta name="description" content="View and manage your upcoming and past appointments on Booky." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#7c5cff" />


  <link rel="stylesheet" href="css/style.css" />
  <script src="/js/i18n/ar.js"></script>
  <script src="/js/i18n.js"></script>
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">
      <a href="dashboard.html" class="logo">
        <span class="logo-mark">📅</span>
        <span>Booky</span>
      </a>

      <nav class="nav-links">
        <button type="button" class="btn btn-ghost btn-sm lang-toggle" data-lang-toggle>العربية</button>
        <a href="dashboard.html" class="btn btn-ghost btn-sm" data-i18n="nav.dashboard">Dashboard</a>
        <a href="browse.html" class="btn btn-ghost btn-sm" data-i18n="nav.browse">Browse</a>
        <button id="logoutBtn" class="btn btn-danger btn-sm" data-i18n="nav.logout">Log out</button>
      </nav>
    </div>
  </header>

  <main class="container section">
    <div class="section-head">
      <span class="eyebrow" data-i18n="mybookings.eyebrow">Appointments</span>
      <h2 data-i18n="menu.myBookings">My Bookings</h2>
      <p data-i18n="mybookings.text">
        View your appointments, cancel bookings, and review completed services.
      </p>
    </div>

    <div id="message" class="message"></div>

    <section id="bookingsGrid" class="items-grid">
      <!-- bookings will load here -->
    </section>
  </main>

  <!-- Review Modal -->
  <div id="reviewModal" class="review-modal hidden">
    <div id="reviewModalBackdrop" class="review-modal-backdrop"></div>

    <section
      class="review-modal-content glass-card"
      role="dialog"
      aria-modal="true"
      aria-labelledby="reviewModalTitle"
    >
      <div class="review-modal-head">
        <div>
          <span class="eyebrow" data-i18n="review.eyebrow">Share Your Experience</span>
          <h3 id="reviewModalTitle" data-i18n="review.heading">Leave a Review</h3>
        </div>

        <button
          id="closeReviewModalBtn"
          type="button"
          class="review-modal-close"
          aria-label="Close review form" data-i18n-attr="aria-label:review.close"
        >
          ×
        </button>
      </div>

      <p id="reviewBookingText" class="review-booking-text"></p>

      <div class="review-field">
        <label data-i18n="review.rating">Your rating</label>

        <div id="starRating" class="star-rating" role="radiogroup">
          <button type="button" class="star-btn" data-rating="1" aria-label="1 star" data-i18n-attr="aria-label:review.stars.1">★</button>
          <button type="button" class="star-btn" data-rating="2" aria-label="2 stars" data-i18n-attr="aria-label:review.stars.2">★</button>
          <button type="button" class="star-btn" data-rating="3" aria-label="3 stars" data-i18n-attr="aria-label:review.stars.3">★</button>
          <button type="button" class="star-btn" data-rating="4" aria-label="4 stars" data-i18n-attr="aria-label:review.stars.4">★</button>
          <button type="button" class="star-btn" data-rating="5" aria-label="5 stars" data-i18n-attr="aria-label:review.stars.5">★</button>
        </div>

        <p id="ratingText" class="rating-text" data-i18n="review.select">Select a rating</p>
      </div>

      <div class="review-field">
        <label for="reviewComment" data-i18n="review.comment">Comment</label>

        <textarea
          id="reviewComment"
          class="review-textarea"
          rows="5"
          maxlength="1000"
          placeholder="Tell us about your experience..." data-i18n-attr="placeholder:review.placeholder"
        ></textarea>

        <p class="review-character-count">
          <span id="reviewCharacterCount">0</span>/1000
        </p>
      </div>

      <div class="review-modal-actions">
        <button
          id="cancelReviewBtn"
          type="button"
          class="btn btn-ghost"
        data-i18n="common.cancel">
          Cancel
        </button>

        <button
          id="submitReviewBtn"
          type="button"
          class="btn btn-primary"
        data-i18n="review.submit">
          Submit Review
        </button>
      </div>
    </section>
  </div>

  <script src="js/my-bookings.js"></script>
  <script src="/js/cookie-consent.js"></script>
  <script src="/js/responsive.js"></script>
</body>
</html>
