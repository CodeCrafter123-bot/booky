<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Edit User — Booky</title>

  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <a href="dashboard.html" class="logo">
      <span class="logo-mark">📅</span>
      <span>Booky</span>
    </a>

    <nav class="nav-links">
      <a href="admin-users.html" class="btn btn-ghost btn-sm">Users</a>
      <a href="dashboard.html" class="btn btn-ghost btn-sm">Dashboard</a>
      <button id="logoutBtn" class="btn btn-danger btn-sm">Log out</button>
    </nav>
  </div>
</header>

<main class="container section">
  <div class="section-head">
    <span class="eyebrow">Admin Panel</span>
    <h2>Edit User</h2>
    <p>Update user information and account role.</p>
  </div>

  <div id="message" class="message"></div>

  <section class="profile-layout">
    <div class="glass-card profile-card">
      <div class="card-header">
        <div>
          <h3>User Details</h3>
          <p>Change the selected user's information.</p>
        </div>
      </div>

      <form id="editUserForm" class="form-grid">
        <div class="form-group">
          <label for="fullName">Full Name</label>
          <input type="text" id="fullName" required />
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" required />
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="text" id="phone" required />
        </div>

        <div class="form-group">
          <label for="role">Role</label>
          <select id="role" required>
            <option value="CLIENT">CLIENT</option>
            <option value="OWNER">OWNER</option>
            <option value="ADMIN">ADMIN</option>
          </select>
          <small class="input-note">Only admins can change user roles.</small>
        </div>

        <button type="submit" id="saveBtn" class="btn btn-primary btn-block">
          Save Changes
        </button>

        <button type="button" class="btn btn-ghost btn-block" onclick="location.href='admin-users.html'">
          Back to Users
        </button>
      </form>
    </div>

    <div class="glass-card profile-card">
      <div class="card-header">
        <div>
          <h3>Selected User</h3>
          <p>Current user summary.</p>
        </div>
      </div>

      <div class="profile-summary">
        <div>
          <span>ID</span>
          <strong id="summaryId">-</strong>
        </div>

        <div>
          <span>Name</span>
          <strong id="summaryName">-</strong>
        </div>

        <div>
          <span>Email</span>
          <strong id="summaryEmail">-</strong>
        </div>

        <div>
          <span>Phone</span>
          <strong id="summaryPhone">-</strong>
        </div>

        <div>
          <span>Role</span>
          <strong id="summaryRole">-</strong>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="js/admin-edit-user.js"></script>
</body>
</html>
