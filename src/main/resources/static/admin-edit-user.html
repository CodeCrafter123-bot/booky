<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title data-i18n="edituser.title">Edit User — Booky</title>
  <meta name="description" content="Edit a user account on Booky." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#7c5cff" />


  <link rel="stylesheet" href="css/style.css" />
  <script src="/js/i18n/ar.js"></script>
  <script src="/js/i18n.js"></script>
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

<header class="navbar">
  <div class="navbar-inner">
    <a href="dashboard.html" class="logo">
      <span class="logo-mark">📅</span>
      <span>Booky</span>
    </a>

    <nav class="nav-links">
      <a href="admin-users.html" class="btn btn-ghost btn-sm" data-i18n="menu.usersShort">Users</a>
      <a href="dashboard.html" class="btn btn-ghost btn-sm" data-i18n="nav.dashboard">Dashboard</a>
      <button type="button" class="btn btn-ghost btn-sm lang-toggle" data-lang-toggle>العربية</button>

      <button id="logoutBtn" class="btn btn-danger btn-sm" data-i18n="nav.logout">Log out</button>
    </nav>
  </div>
</header>

<main class="container section">
  <div class="section-head">
    <span class="eyebrow" data-i18n="menu.adminPanel">Admin Panel</span>
    <h2 data-i18n="edituser.heading">Edit User</h2>
    <p data-i18n="edituser.text">Update user information and account role.</p>
  </div>

  <div id="message" class="message"></div>

  <section class="profile-layout">
    <div class="glass-card profile-card">
      <div class="card-header">
        <div>
          <h3 data-i18n="edituser.details">User Details</h3>
          <p data-i18n="edituser.detailsText">Change the selected user's information.</p>
        </div>
      </div>

      <form id="editUserForm" class="form-grid">
        <div class="form-group">
          <label for="fullName" data-i18n="auth.fullName">Full Name</label>
          <input type="text" id="fullName" required />
        </div>

        <div class="form-group">
          <label for="email" data-i18n="profile.email">Email Address</label>
          <input type="email" id="email" required />
        </div>

        <div class="form-group">
          <label for="phone" data-i18n="auth.phone">Phone Number</label>
          <input type="text" id="phone" required />
        </div>

        <div class="form-group">
          <label for="role" data-i18n="dash.stat.role">Role</label>
          <select id="role" required>
            <option value="CLIENT" data-i18n="role.client">CLIENT</option>
            <option value="OWNER" data-i18n="role.owner">OWNER</option>
            <option value="ADMIN" data-i18n="role.admin">ADMIN</option>
          </select>
          <small class="input-note" data-i18n="edituser.roleNote">Only admins can change user roles.</small>
        </div>

        <button type="submit" id="saveBtn" class="btn btn-primary btn-block" data-i18n="common.saveChanges">
          Save Changes
        </button>

        <button type="button" class="btn btn-ghost btn-block" onclick="location.href='admin-users.html'" data-i18n="edituser.back">
          Back to Users
        </button>
      </form>
    </div>

    <div class="glass-card profile-card">
      <div class="card-header">
        <div>
          <h3 data-i18n="edituser.selected">Selected User</h3>
          <p data-i18n="edituser.selectedText">Current user summary.</p>
        </div>
      </div>

      <div class="profile-summary">
        <div>
          <span data-i18n="common.id">ID</span>
          <strong id="summaryId">-</strong>
        </div>

        <div>
          <span data-i18n="common.name">Name</span>
          <strong id="summaryName">-</strong>
        </div>

        <div>
          <span data-i18n="auth.email">Email</span>
          <strong id="summaryEmail">-</strong>
        </div>

        <div>
          <span data-i18n="common.phone">Phone</span>
          <strong id="summaryPhone">-</strong>
        </div>

        <div>
          <span data-i18n="dash.stat.role">Role</span>
          <strong id="summaryRole">-</strong>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="js/admin-edit-user.js"></script>
  <script src="/js/cookie-consent.js"></script>
  <script src="/js/responsive.js"></script>
</body>
</html>
