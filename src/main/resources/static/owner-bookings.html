<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title data-i18n="ownerbookings.title">Owner Bookings — Booky</title>
  <meta name="description" content="View and manage incoming bookings for your business on Booky." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#7c5cff" />


  <link rel="stylesheet" href="css/style.css" />
  <script src="/js/i18n/ar.js"></script>
  <script src="/js/i18n.js"></script>
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <div class="sidebar-logo">
      <a href="dashboard.html" class="logo">
        <span class="logo-mark">📅</span>
        <span>Booky</span>
      </a>
    </div>

    <nav class="sidebar-nav">
      <a href="dashboard.html" class="sidebar-link">
        <span class="ico">🏠</span>
        <span data-i18n="nav.dashboard">Dashboard</span>
      </a>

      <a href="browse.html" class="sidebar-link">
        <span class="ico">🏢</span>
        <span data-i18n="dash.stat.businesses">Businesses</span>
      </a>

      <a href="owner-bookings.html" class="sidebar-link active">
        <span class="ico">📅</span>
        <span data-i18n="menu.bookingActivity">Booking Activity</span>
      </a>

      <a href="profile.html" class="sidebar-link">
        <span class="ico">👤</span>
        <span data-i18n="menu.profile">Profile</span>
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="avatar" id="avatarInitial">O</div>
        <div class="user-chip-info">
          <div class="user-chip-name" id="userName">Owner</div>
          <div class="user-chip-role" id="userRole" data-i18n="role.owner">OWNER</div>
        </div>
      </div>

      <button type="button" class="btn btn-ghost btn-block btn-sm lang-toggle" data-lang-toggle>العربية</button>

      <button class="btn btn-danger btn-block btn-sm" id="logoutBtn" data-i18n="nav.logout">
        Log out
      </button>
    </div>
  </aside>

  <main class="main-content">
    <div class="page-header">
      <div>
        <span class="eyebrow" data-i18n="dash.owner.actionsTitle">Owner Workspace</span>
        <h1 data-i18n="ownerbookings.heading">Booking Activity 📅</h1>
        <p data-i18n="ownerbookings.text">View client bookings for your businesses and services.</p>
      </div>

      <button class="btn btn-ghost btn-sm" id="refreshBtn" data-i18n="common.refresh">
        Refresh
      </button>
    </div>

    <section class="glass-card admin-section">
      <div class="admin-section-header">
        <div>
          <h2 data-i18n="ownerbookings.listHeading">Your Business Bookings</h2>
          <p data-i18n="ownerbookings.listText">All bookings across your businesses.</p>
        </div>
      </div>

      <div id="message" class="message"></div>

      <div id="bookingsContainer" class="admin-list">
        <!-- Owner bookings load here -->
      </div>
    </section>
  </main>

</div>

<script src="js/owner-bookings.js"></script>

  <script src="/js/cookie-consent.js"></script>
  <script src="/js/responsive.js"></script>
</body>
</html>
