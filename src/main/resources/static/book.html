<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="book.title">Book Appointment — Booky</title>
  <meta name="description" content="Choose a time slot and confirm your appointment on Booky." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#7c5cff" />


  <link rel="stylesheet" href="css/style.css" />
  <script src="/js/i18n/ar.js"></script>
  <script src="/js/i18n.js"></script>
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">
      <a href="dashboard.html" class="logo">
        <span class="logo-mark">📅</span>
        <span>Booky</span>
      </a>

      <nav class="nav-links">
        <button type="button" class="btn btn-ghost btn-sm lang-toggle" data-lang-toggle>العربية</button>
        <a href="services.html" class="btn btn-ghost btn-sm" data-i18n="nav.back">← Back</a>
      </nav>
    </div>
  </header>

  <main class="container section">
    <div class="section-head center">
      <span class="eyebrow" data-i18n="book.eyebrow">Booking</span>
      <h2 data-i18n="book.heading">Book Appointment</h2>
      <p data-i18n="book.text">Select a date, choose an available slot, and confirm your booking.</p>
    </div>

    <section class="glass-card auth-card">
      <div class="card-header">
        <div>
          <h3 data-i18n="book.details">Appointment Details</h3>
          <p data-i18n="book.onlyAvailable">Only available times are shown.</p>
        </div>
      </div>

      <div id="message" class="message"></div>

      <form id="bookingForm" class="form-stack">
        <div class="form-group">
          <label class="form-label" for="appointmentDate" data-i18n="book.date">Appointment Date</label>
          <input type="date" id="appointmentDate" class="form-input" required>
        </div>

        <button type="button" id="loadSlotsBtn" class="btn btn-secondary btn-block" data-i18n="book.showTimes">
          Show Available Times
        </button>

        <div class="form-group">
          <label class="form-label" data-i18n="book.times">Available Times</label>
          <div id="slotsContainer" class="slot-grid"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" data-i18n="book.confirm">
          Confirm Booking
        </button>
      </form>
    </section>
  </main>

  
  <script src="js/book.js"></script>
  <script src="/js/cookie-consent.js"></script>
  <script src="/js/responsive.js"></script>
</body>
</html>
