<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Appointment — Booky</title>

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="navbar">
    <div class="navbar-inner">
      <a href="dashboard.html" class="logo">
        <span class="logo-mark">📅</span>
        <span>Booky</span>
      </a>

      <a href="services.html" class="btn btn-ghost btn-sm">← Back</a>
    </div>
  </header>

  <main class="container section">
    <div class="section-head center">
      <span class="eyebrow">Booking</span>
      <h2>Book Appointment</h2>
      <p>Select a date, choose an available slot, and confirm your booking.</p>
    </div>

    <section class="glass-card auth-card">
      <div class="card-header">
        <div>
          <h3>Appointment Details</h3>
          <p>Only available times are shown.</p>
        </div>
      </div>

      <div id="message" class="message"></div>

      <form id="bookingForm" class="form-stack">
        <div class="form-group">
          <label class="form-label" for="appointmentDate">Appointment Date</label>
          <input type="date" id="appointmentDate" class="form-input" required>
        </div>

        <button type="button" id="loadSlotsBtn" class="btn btn-secondary btn-block">
          Show Available Times
        </button>

        <div class="form-group">
          <label class="form-label">Available Times</label>
          <div id="slotsContainer" class="slot-grid"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">
          Confirm Booking
        </button>
      </form>
    </section>
  </main>

  
  <script src="js/book.js"></script>
</body>
</html>
