<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Booky Dashboard">
    <meta name="author" content="Hussein Zeidan">

    <title>Booky - Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<!-- ============== TOP BAR ============== -->
<header class="dash-header">
    <div class="dash-header__inner">
        <a href="dashboard.html" class="wordmark wordmark--dark">
            <span class="wordmark__mark">B</span>
            <span class="wordmark__text">Booky</span>
        </a>

        <div class="dash-header__user">
            <div class="user-chip">
                <span class="user-chip__avatar" id="userAvatar">?</span>
                <div class="user-chip__info">
                    <span class="user-chip__name" id="userName">Loading...</span>
                    <span class="user-chip__role" id="userRole">—</span>
                </div>
            </div>
            <button type="button" class="btn-logout" id="logoutBtn">Log out</button>
        </div>
    </div>
</header>

<main class="dash-main">

    <!-- ============== WELCOME STRIP ============== -->
    <section class="welcome-strip">
        <div class="welcome-strip__copy">
            <span class="eyebrow">Dashboard</span>
            <h1 id="welcomeHeadline">Welcome back.</h1>
            <p id="welcomeSub">Here's what's on your schedule.</p>
        </div>

        <div class="welcome-strip__visual" aria-hidden="true">
            <div class="ledger-card ledger-card--front ledger-card--static">
                <span class="ledger-card__status">Today</span>
                <span class="ledger-card__time" id="todayDate">—</span>
                <span class="ledger-card__label">Nothing booked yet</span>
            </div>
        </div>
    </section>

    <!-- ============== QUICK ACTIONS ============== -->
    <section class="quick-actions">
        <div class="section-head section-head--left">
            <h2>Quick actions</h2>
        </div>

        <div class="action-grid" id="actionGrid">
            <!-- Populated by dashboard.js based on role -->
        </div>
    </section>

</main>

<script src="js/dashboard.js"></script>

</body>

</html>
