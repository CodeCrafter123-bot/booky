<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Dashboard — Booky</title>
  <meta name="description" content="Your Booky dashboard — manage bookings and account details." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon.ico" sizes="32x32" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <meta name="theme-color" content="#7c5cff" />


  <link rel="stylesheet" href="css/style.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body>

  <div class="mobile-topbar">
    <button class="mobile-menu-btn" id="mobileMenuBtn" aria-label="Toggle menu">☰</button>

    <a href="dashboard.html" class="logo">
      <span class="logo-mark">📅</span>
      <span>Booky</span>
    </a>

    <div class="mobile-spacer"></div>
  </div>

  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo">
        <a href="dashboard.html" class="logo">
          <span class="logo-mark">📅</span>
          <span>Booky</span>
        </a>
      </div>

      <nav class="sidebar-nav" id="sidebarNav"></nav>

      <div class="sidebar-footer">
        <div class="user-chip">
          <div class="avatar" id="avatarInitial">?</div>

          <div class="user-chip-info">
            <div class="user-chip-name" id="userName">User</div>
            <div class="user-chip-role" id="userRole">CLIENT</div>
          </div>
        </div>

        <button class="btn btn-danger btn-block btn-sm" id="logoutBtn">
          Log out
        </button>
      </div>
    </aside>

    <main class="main-content">
      <section class="dashboard-hero">
        <div>
          <span class="role-pill" id="rolePill">CLIENT</span>
          <h1 id="welcomeHeading">Welcome back 👋</h1>
          <p id="welcomeSub">
            Manage your Booky account, bookings, businesses, and services from one clean dashboard.
          </p>
        </div>

        <div class="hero-actions">
          <a href="browse.html" class="btn btn-primary">Browse Businesses</a>
          <a href="profile.html" class="btn btn-ghost">Profile</a>
        </div>
      </section>

      <section class="stat-grid" id="statGrid"></section>

      <section class="dashboard-section">
        <div class="section-heading">
          <div>
            <span class="eyebrow">Workspace</span>
            <h2 id="actionsTitle">Quick Actions</h2>
            <p id="actionsSubtitle">Choose what you want to manage next.</p>
          </div>
        </div>

        <div class="action-grid" id="actionGrid"></div>
      </section>
    </main>
  </div>

  <script src="js/dashboard.js"></script>
  <script src="/js/cookie-consent.js"></script>
  <script src="/js/responsive.js"></script>
</body>
</html>
