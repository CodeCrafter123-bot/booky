spring.application.name=booky

spring.datasource.url=${BOOKY_DB_URL}
spring.datasource.username=${BOOKY_DB_USERNAME}
spring.datasource.password=${BOOKY_DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${BOOKY_MAIL_USERNAME:disabled@booky.local}
spring.mail.password=${BOOKY_MAIL_PASSWORD:disabled}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

booky.email.enabled=false