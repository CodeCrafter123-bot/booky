# Activate with SPRING_PROFILES_ACTIVE=prod
# All secrets/config below must be supplied via environment variables at deploy time.

# Schema must already match the entities (via a migration or manual DDL) -
# the app must never auto-alter a production database on boot.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Railway terminates HTTPS at its proxy. Trust the X-Forwarded-* headers it sends
# so the app knows its real public address; otherwise its own pages look like a
# foreign site and their form submissions are rejected with 403.
server.forward-headers-strategy=framework
